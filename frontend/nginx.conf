server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Proxy vers l'API FastAPI ────────────────────────────────────────────
    # En prod Docker, "api" est le nom du service dans docker-compose.yml
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_redirect off;
        proxy_http_version 1.1;

        # SSE : désactiver le buffering pour que les tokens arrivent en temps réel
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS géré par FastAPI, on ne le duplique pas ici
    }

    # ── Assets statiques (JS/CSS buildés par Vite) ──────────────────────────
    # Vite génère des noms avec hash (main-abc123.js) : cache agressif
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── index.html : pas de cache (React Router côté client) ───────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── SPA fallback : tout ce qui n'est pas un fichier → index.html ───────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Sécurité basique ────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header Referrer-Policy         "strict-origin" always;

    # Masquer la version nginx
    server_tokens off;
}